<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OUTILS IA 2026 🚀</title>
  <!-- Bootstrap 5 + icônes -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <!-- Notre CSS -->
  <link rel="stylesheet" href="style.css">
  <!-- Firebase SDK (compat modules) - sera utilisé au Sprint 3 -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container py-4 py-md-5">
  <!-- HEADER -->
  <header class="text-center mb-5">
    <span class="badge bg-secondary mb-2">Curated Stack 2026</span>
    <h1 class="display-4 fw-800 text-white">L'Arsenal <span class="text-gradient">IA Absolu</span></h1>
    <p class="lead text-muted mx-auto" style="max-width: 650px;">
      Sélection des meilleures IA et automatisations testées pour accélérer votre business.
    </p>
    <div class="mt-3">
      <span class="badge bg-dark text-light border border-secondary px-3 py-2">
        <i class="bi bi-eye me-1"></i> Total clics : <span id="totalClicks">0</span>
      </span>
    </div>
  </header>

  <!-- RECHERCHE -->
  <div class="row g-3 mb-4 justify-content-center">
    <div class="col-md-8 col-lg-6">
      <input type="text" id="searchBar" class="form-control bg-dark text-white border-secondary py-2" style="border-radius: 12px;" placeholder="🔍 Rechercher un outil ou une compétence...">
    </div>
  </div>

  <!-- FILTRES -->
  <div class="d-flex flex-wrap gap-2 justify-content-center mb-5" id="filterContainer">
    <!-- Les boutons seront générés dynamiquement par JavaScript au Sprint 2 -->
  </div>

  <!-- GRILLE DES OUTILS -->
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="toolsGrid">
    <!-- Le rendu dynamique sera fait par JavaScript au Sprint 2 -->
    <div class="col-12 text-center text-muted py-5">
      <i class="bi bi-hourglass-split display-3 d-block mb-3"></i>
      Chargement des outils...
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="text-center text-muted small mt-5 pt-4 border-top border-secondary">
    <p>© 2026 — OUTILS IA 2026 · Curation par <a href="https://github.com/sieni7" target="_blank" class="text-light text-decoration-none">sieni7</a></p>
  </footer>
</div>

<!-- Configuration Firebase (clés, ignoré par Git) -->
  <script src="firebase-config.js"></script>

<!-- Nos scripts (modules) -->
  <script type="module" src="data.js"></script>
  <script type="module" src="app.js"></script>

</body>
</html>
